[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "display-location"
version = "1.0.0"
description = "Windows tray app to reposition the second monitor around the primary."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "PySide6",
    "pywin32",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
